name: update-evidence
# 毎週月曜（日本時間 朝7時）に、PubMedから最新の論文の一覧を取得して、public/content/latest.json を更新する。
# 変更があれば、自動で commit され、Vercel が、自動で、本番に反映する。
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-evidence.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/content/latest.json; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/latest.json
          git commit -m "chore: weekly evidence update"
          git push
